# E2 — generators in their original form. Every input and parameter.
# GPU placement for BLANKET comes from the environment (IDENTITY_GPU, SWAP_GPU, CTX_ID).

[inputs]
videos = ["demo1", "demo2", "demo3"]

[detect]
model = "scrfd-10gf"
conf = 0.1   # DECISIONS.md 35: the pipeline default; below 0.5 only extends tracks
det_size = 640

[[arms]]
name = "blur"
backend = "censor"
mode = "blur"

[[arms]]
name = "mosaic"
backend = "censor"
mode = "mosaic"

[[arms]]
name = "ciagan"
backend = "ciagan"

[[arms]]
name = "ganonymization"
backend = "ganonymization"

[[arms]]
name = "blanket"
backend = "blanket"
identity_prepass = false  # original BLANKET: identity from the first usable crop
swap_mode = "native"      # FaceFusion's own mix, as shipped
detection = "upstream"    # BLANKET's own yolo_face re-detection (DECISIONS.md 36)

[eval]
far = 0.01
recognizers = ["facenet", "arcface"]
utility = ["expression", "pose", "gaze", "emotion", "attributes"]
bootstrap = 2000
seed = 0

[eval.strata]
face_size_px = [0, 48, 96, 1000000]   # sqrt(box area) bins
abs_yaw_deg = [0, 20, 45, 181]          # last bin: profile and beyond
det_conf = [0.1, 0.5, 1.01]               # open point 1: primary privacy measure on >= 0.5

[tables]
main = ["coverage", "facenet.rank1", "arcface.rank1", "emotion.agreement", "expression.error", "consistency"]
exposure = ["generated", "reused", "filled"]   # final-video composition, all face boxes
