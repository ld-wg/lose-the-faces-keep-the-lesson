[project]
name = "lose-the-faces-keep-the-lesson"
version = "0.1.0"
description = "Expression-preserving face de-identification for educational research"
requires-python = ">=3.11"
dependencies = [
    "insightface>=0.7.3",
    # Developed on Mac, only ever run on Linux (serra1 or similar CUDA
    # machines) — onnxruntime-gpu has no macOS wheel at all, so the split
    # is platform-gated, not a manual/opt-in choice. `uv sync` installs the
    # right one automatically on either machine, no flags needed.
    "onnxruntime>=1.16.0; sys_platform == 'darwin'",
    # Upper-bounded deliberately: onnxruntime-gpu's CUDA/cuDNN requirement
    # jumps by major version across releases (1.18-1.20 target CUDA 12.x;
    # 1.27+ moved to CUDA 13.x). serra1's driver caps at CUDA 12.5 (see
    # `nvidia-smi`) — a driver can never run a newer CUDA than it reports,
    # no library install fixes that. Verified 1.19.2 actually initializes
    # CUDAExecutionProvider (not just lists it) and runs real inference on
    # serra1's already-installed CUDA 12.5 + cuDNN 9 system libraries — no
    # nvidia-*-cu12 pip deps needed. Re-verify this range before bumping it.
    "onnxruntime-gpu>=1.19,<1.21; sys_platform == 'linux'",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
]

# Kept optional (not in `dependencies`) so a plain `uv sync` stays light —
# only matters for the yolo-facev2-s Tier 0.5 candidate
# (research/stages/identification.md), not the deployed SCRFD-10GF default.
# Needed only for a one-time checkpoint -> ONNX conversion
# (models/yolo_facev2_s/convert.py); the resulting .onnx is loaded at
# inference time via the same insightface/onnxruntime stack SCRFD-10GF
# already uses, no extra needed for that part.
[project.optional-dependencies]
yolo-facev2-convert = [
    "torch>=2.2",
]

# Phase 2 — CIAGAN generation backend (phase2_generate/models/ciagan/).
# Unlike the Phase 1 ONNX detectors, this keeps PyTorch native at inference
# time (see models/ciagan/NOTICE.md for why) and adds `dlib` for the
# 68-point landmark extraction the checkpoint's architecture depends on —
# no Phase 1 detector backend produces landmarks dense enough for it.
#
# `dlib` has no prebuilt PyPI wheel for any recent release (verified:
# 19.24.2/19.24.4/19.24.6/20.0.1 are all sdist-only) — installing this
# extra compiles from source. `[tool.uv.extra-build-dependencies]` below
# provisions `cmake` into dlib's isolated build environment automatically
# (verified on serra1: a plain `uv sync --extra phase2-ciagan` builds dlib
# successfully with no system-wide cmake, no sudo). What that can't paper
# over is a missing C++ compiler itself — verified failing on a Mac with no
# Xcode Command Line Tools installed (cmake's compiler-sanity-check step
# fails outright). Run `xcode-select --install` first on a fresh Mac.
#
# `torch` is capped on Linux for the exact same reason as onnxruntime-gpu
# above: its default PyPI wheel bundles its own CUDA 13.0 runtime, and
# serra1's driver (555.42, CUDA 12.5 max per `nvidia-smi`) can't run it —
# confirmed empirically (`torch.cuda.is_available()` False, "CUDA
# initialization: driver too old"). Redirected to PyTorch's own cu124
# wheel index instead (see `[tool.uv.sources]`/`[[tool.uv.index]]` below),
# capped at <2.7 since that's the newest torch version cu124 publishes.
# Verified on serra1: torch==2.6.0+cu124 initializes CUDA and runs a real
# matmul on-device. No cap needed on Mac (MPS/CPU only, no driver ceiling).
phase2-ciagan = [
    "torch>=2.2,<2.7; sys_platform == 'linux'",
    "torch>=2.2; sys_platform == 'darwin'",
    "dlib>=19.24",
]

# SCRFD-34GF's conversion tool (models/scrfd_34gf/convert.py) is NOT set up
# through this file: mmcv 1.3.x / mmdet 2.11.0 predate PEP 517 build
# isolation and don't resolve cleanly through uv's project lock. It needs
# its own disposable Python 3.8 environment, built from OpenMMLab's
# official prebuilt wheels instead of source — see convert.py's docstring
# for the exact, verified recipe.

[tool.uv]
package = false

# dlib's sdist build shells out to `cmake` directly — this provisions it
# into dlib's isolated build environment (via the `cmake` PyPI package,
# prebuilt binaries) so `uv sync --extra phase2-ciagan` works standalone,
# with no system-wide cmake install or sudo needed. Verified on serra1
# (no system cmake, no sudo access) — see phase2-ciagan's comment above.
[tool.uv.extra-build-dependencies]
dlib = ["cmake"]

# See phase2-ciagan's comment above: redirects `torch` to PyTorch's own
# CUDA-12.4 wheel index on Linux only, instead of the default PyPI index
# (which resolves to a CUDA-13.0-only build serra1's driver can't run).
# `explicit = true` keeps this index from being used for any other
# package's resolution.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# insightface unconditionally requires plain `onnxruntime` regardless of
# platform, which would collide with onnxruntime-gpu above on Linux (both
# install files under the same `onnxruntime` import name). This overrides
# insightface's own declared deps to drop that one entry — our own
# platform-gated onnxruntime/onnxruntime-gpu above already covers what it
# actually needs. Verified live on serra1 (disposable scratch project):
# `uv sync` there installs onnxruntime-gpu only, no plain onnxruntime
# alongside it, and both `onnxruntime.get_available_providers()` (includes
# CUDAExecutionProvider) and `import insightface` work correctly.
#
# Pinned to insightface's exact resolved version below — if insightface is
# ever upgraded, this list needs re-checking against its new metadata
# (`python -c "import importlib.metadata as m; print(m.distribution('insightface').requires)"`)
# or the override may silently stop applying / go stale.
[[tool.uv.dependency-metadata]]
name = "insightface"
version = "2.0"
requires-dist = [
    "numpy",
    "onnx>=1.13",
    "opencv-python",
    "tqdm",
    "requests",
    "scipy",
    "scikit-image",
    "PySide6-Essentials>=6.5; extra == 'gui'",
    "Pillow>=9.1; extra == 'gui'",
    "reportlab; extra == 'gui'",
    "scikit-learn; extra == 'gui'",
    "cryptography>=42.0.0; extra == 'gui'",
    "rfc8785>=0.1.4; extra == 'gui'",
    "av>=12; extra == 'gui'",
    "PyYAML>=6.0; extra == 'gui'",
    "av>=12; extra == 'privateframe'",
    "PyYAML>=6.0; extra == 'privateframe'",
    "cython; extra == 'face3d'",
    "albumentations; extra == 'face3d'",
    "matplotlib; extra == 'face3d'",
]
